# --- Backend & Performance (The Tearing Fix) ---
backend = "xrender";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# --- Opacity Rules ---
active-opacity = 1;
inactive-opacity = 1;
frame-opacity = 1.0;          # Keeps window borders solid
#inactive-opacity-override = false;
#opacity-rule = [
#  "90:class_g = 'st'"
#];
# --- Disable Eye Candy ---
corner-radius = 2;            # No rounded corners
shadow = false;               # No shadows (keeps it lightweight)
fading = false;               # No fading animations (feels faster)

# --- Everforest Theming Note ---
# Compositors don't handle color themes (that's your WM/GTK), 
# but we can ensure the compositor doesn't wash out colors.
detect-transient = true;
detect-client-leader = true;
