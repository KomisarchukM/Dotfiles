;; ╔══════════════════════════════════════════════════════════════╗
;; ║  Polybar · Dark Everforest · Alpine + BSPWM                 ║
;; ║  ~/.config/polybar/config.ini                               ║
;; ╚══════════════════════════════════════════════════════════════╝

; ── Everforest Dark Hard palette ────────────────────────────────
[colors]
bg        = #1d2021
bg-alt    = #272e33
bg-hl     = #2d353b
border    = #3d484d
fg        = #d3c6aa
fg-dim    = #859289
fg-dark   = #4a5560
red       = #e67e80
orange    = #e69875
yellow    = #dbbc7f
green     = #a7c080
aqua      = #83c092
blue      = #7fbbb3
purple    = #d699b6
none      = #00000000

; ── Bar ─────────────────────────────────────────────────────────
[bar/main]
monitor             = ${env:MONITOR:}

; 10 px gap on top and both sides
width               = 100%:-20
height              = 36
offset-x            = 10
offset-y            = 10

; hard rectangular — zero radius
radius              = 0

fixed-center        = true
bottom              = false

background          = ${colors.bg}
foreground          = ${colors.fg}

; thin underline for focused workspace — no borders on bar itself
line-size           = 2
border-size         = 0

padding-left        = 1
padding-right       = 1

module-margin-left  = 0
module-margin-right = 0

; font-0 → text/icons (Nerd Font)  font-1 → bold labels
font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
font-2 = JetBrainsMono Nerd Font:style=Medium:size=9;2

modules-left   = bspwm sep date
modules-center = mpris
modules-right  = brightness sep volume sep battery sep time

tray-position  = none

wm-restack     = bspwm
override-redirect = false

cursor-click   = pointer
cursor-scroll  = ns-resize

; ── Separator ───────────────────────────────────────────────────
[module/sep]
type            = custom/text
content         = │
content-foreground = ${colors.border}
content-padding = 1

; ── BSPWM workspaces ────────────────────────────────────────────
[module/bspwm]
type = internal/bspwm

; only show workspaces on the bar's own monitor
pin-workspaces   = true
strip-wsnumbers  = true
index-sort       = true
enable-click     = true
enable-scroll    = false
reverse-scroll   = false

; focused
label-focused            = %name%
label-focused-foreground = ${colors.green}
label-focused-background = ${colors.bg-hl}
label-focused-underline  = ${colors.green}
label-focused-padding    = 2

; occupied (window open, not focused)
label-occupied            = %name%
label-occupied-foreground = ${colors.fg-dim}
label-occupied-padding    = 2

; urgent (e.g. terminal bell)
label-urgent            = %name%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg-alt}
label-urgent-padding    = 2

; empty
label-empty            = %name%
label-empty-foreground = ${colors.fg-dark}
label-empty-padding    = 2

; thin separator between workspace labels
label-separator            = ·
label-separator-foreground = ${colors.border}
label-separator-padding    = 0

; ── Date ────────────────────────────────────────────────────────
[module/date]
type     = internal/date
interval = 60

date   = %a %d %b
format = <label>
label  =  %date%

label-foreground = ${colors.fg-dim}
label-padding    = 1

; ── Currently Playing (playerctl / MPRIS) ───────────────────────
[module/mpris]
type             = custom/script
exec             = ~/.config/polybar/mpris.sh
interval         = 2
format           = <label>
label            = %output:0:60%
label-foreground = ${colors.yellow}
; ── Brightness (brightnessctl) ───────────────────────────────────
[module/brightness]
type     = custom/script
exec     = printf '󰃞  %s%%' "$(brightnessctl -m | awk -F, '{gsub(/%/,"",$4); print $4}')"
interval = 5

format           = <label>
label            = %output%
label-foreground = ${colors.fg-dim}
label-padding    = 1

scroll-up   = brightnessctl set 5%+ -q
scroll-down = brightnessctl set 5%- -q

; ── Volume (PulseAudio / PipeWire-pulse) ────────────────────────
[module/volume]
type = internal/pulseaudio
use-ui-max  = false
interval    = 5

format-volume    = <label-volume>
label-volume     = 󰕾  %percentage%%
label-volume-foreground = ${colors.fg-dim}
label-volume-padding    = 1

; muted
label-muted          = 󰝟  muted
label-muted-foreground = ${colors.fg-dark}
label-muted-padding    = 1

click-right = pavucontrol &

; ── Battery ─────────────────────────────────────────────────────
[module/battery]
type        = internal/battery
battery     = BAT0
adapter     = AC
full-at     = 98
low-at      = 15
poll-interval = 30

; icons via ramp (0 = empty → 9 = full)
ramp-capacity-0          = 󰁺
ramp-capacity-1          = 󰁻
ramp-capacity-2          = 󰁼
ramp-capacity-3          = 󰁽
ramp-capacity-4          = 󰁾
ramp-capacity-5          = 󰁿
ramp-capacity-6          = 󰂀
ramp-capacity-7          = 󰂁
ramp-capacity-8          = 󰂂
ramp-capacity-9          = 󰂃
ramp-capacity-foreground = ${colors.fg-dim}

format-charging    = <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
format-full        = <label-full>
format-low         = <label-low>

label-charging            = 󰂄  %percentage%%
label-charging-foreground = ${colors.green}
label-charging-padding    = 1

label-discharging            = %percentage%%
label-discharging-foreground = ${colors.fg-dim}
label-discharging-padding    = 1

label-full            = 󰁹  full
label-full-foreground = ${colors.green}
label-full-padding    = 1

label-low            = 󰃍  %percentage%%
label-low-foreground = ${colors.red}
label-low-padding    = 1

; ── Time ────────────────────────────────────────────────────────
[module/time]
type     = internal/date
interval = 30

time   = %H:%M
format = <label>
label  = 󰅐  %time%

label-foreground = ${colors.fg}
label-padding    = 1
